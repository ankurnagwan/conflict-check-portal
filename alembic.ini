# Alembic configuration.
#
# %(here)s is the folder that contains THIS file. Using it (instead of a bare relative
# "alembic") means the paths below resolve correctly from ANY working directory and however
# the repository zip was extracted or moved, so Alembic can never fail with "Path doesn't exist".
#
# Three layers keep this safe:
#   1. this file                    -> script_location = %(here)s/alembic
#   2. database.py (the app)        -> sets an absolute script_location in code, ignoring this file
#   3. bootstrap.py (every start)     -> re-creates / repairs this file and the alembic folder if damaged
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
version_path_separator = os

# sqlalchemy.url is intentionally NOT set: alembic/env.py uses the application's own engine
# (SQLite WAL + foreign-key pragmas) so CLI migrations and app migrations behave identically.